name: Recent Activity

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update Readme with Recent Activity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize activity markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          content = content.replace("<!-- START_SECTION:activity -->", "<!--START_SECTION:activity-->")
          content = content.replace("<!-- END_SECTION:activity -->", "<!--END_SECTION:activity-->")
          readme.write_text(content, encoding="utf-8")
          PY
      - uses: jamesgeorge007/github-activity-readme@v0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: 'chore(readme): update recent activity feed'
          MAX_LINES: 5
