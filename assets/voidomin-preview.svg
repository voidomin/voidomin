<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="voidomin GitHub profile preview">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="vacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="vclip"><rect width="1200" height="675" rx="14"/></clipPath>
  </defs>

  <!-- Window chrome -->
  <rect width="1200" height="675" rx="14" fill="url(#vbg)" clip-path="url(#vclip)"/>
  <rect width="1200" height="42" fill="url(#vbar)"/>
  <circle cx="22" cy="21" r="7" fill="#ff5f57"/>
  <circle cx="44" cy="21" r="7" fill="#febc2e"/>
  <circle cx="66" cy="21" r="7" fill="#28c840"/>
  <rect x="180" y="10" width="520" height="22" rx="11" fill="#0d1117" opacity="0.8"/>
  <text x="440" y="25" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">github.com/voidomin</text>

  <!-- Avatar -->
  <circle cx="120" cy="145" r="52" fill="url(#vacc)"/>
  <text x="120" y="155" fill="white" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle">A</text>

  <!-- Name & bio -->
  <text x="196" y="120" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Akash Bhat</text>
  <text x="196" y="148" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="15">Data Science Engineer · Structural Biology · GCP</text>

  <!-- Follow button -->
  <rect x="196" y="162" width="100" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="246" y="181" fill="#c9d1d9" font-family="Arial" font-size="13" text-anchor="middle">Follow</text>

  <!-- Divider -->
  <line x1="60" y1="218" x2="1140" y2="218" stroke="#21262d" stroke-width="1"/>

  <!-- Pinned repos section -->
  <text x="60" y="248" fill="#8b949e" font-family="Arial" font-size="13" font-weight="600">Pinned</text>

  <!-- Repo card 1 -->
  <rect x="60" y="262" width="340" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="84" y="292" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="600">📋 voidomin</text>
  <text x="84" y="314" fill="#8b949e" font-family="Arial" font-size="12">Profile landing page for bio-tech</text>
  <text x="84" y="330" fill="#8b949e" font-family="Arial" font-size="12">engineering work and site assets</text>
  <circle cx="92" cy="368" r="6" fill="#7c3aed"/>
  <text x="104" y="373" fill="#8b949e" font-family="Arial" font-size="12">Markdown</text>
  <text x="310" y="373" fill="#8b949e" font-family="Arial" font-size="12">★ 2</text>

  <!-- Repo card 2 -->
  <rect x="430" y="262" width="340" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="454" y="292" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="600">⚛ react-projects</text>
  <text x="454" y="314" fill="#8b949e" font-family="Arial" font-size="12">Curated React demos, UI experiments</text>
  <text x="454" y="330" fill="#8b949e" font-family="Arial" font-size="12">and deployed front-end prototypes</text>
  <circle cx="462" cy="368" r="6" fill="#61dafb"/>
  <text x="474" y="373" fill="#8b949e" font-family="Arial" font-size="12">TypeScript</text>
  <text x="680" y="373" fill="#8b949e" font-family="Arial" font-size="12">★ 3</text>

  <!-- Repo card 3 -->
  <rect x="800" y="262" width="340" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="824" y="292" fill="#58a6ff" font-family="Arial" font-size="14" font-weight="600">🗺 param-adventures</text>
  <text x="824" y="314" fill="#8b949e" font-family="Arial" font-size="12">Scalable tourism platform with</text>
  <text x="824" y="330" fill="#8b949e" font-family="Arial" font-size="12">role-based access and admin tools</text>
  <circle cx="832" cy="368" r="6" fill="#ff2d20"/>
  <text x="844" y="373" fill="#8b949e" font-family="Arial" font-size="12">PHP · Laravel</text>
  <text x="1060" y="373" fill="#8b949e" font-family="Arial" font-size="12">★ 1</text>

  <!-- Contribution graph label -->
  <text x="60" y="430" fill="#8b949e" font-family="Arial" font-size="13" font-weight="600">434 contributions in the last year</text>

  <!-- Contribution grid -->
  <rect x="60" y="445" width="1080" height="160" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <!-- Month labels -->
  <text x="80" y="462" fill="#8b949e" font-family="Arial" font-size="10">Jul</text>
  <text x="200" y="462" fill="#8b949e" font-family="Arial" font-size="10">Sep</text>
  <text x="330" y="462" fill="#8b949e" font-family="Arial" font-size="10">Nov</text>
  <text x="460" y="462" fill="#8b949e" font-family="Arial" font-size="10">Jan</text>
  <text x="590" y="462" fill="#8b949e" font-family="Arial" font-size="10">Mar</text>
  <text x="720" y="462" fill="#8b949e" font-family="Arial" font-size="10">May</text>
  <text x="880" y="462" fill="#8b949e" font-family="Arial" font-size="10">Jun</text>

