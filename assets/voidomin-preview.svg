    <rect x="880" y="483" width="9" height="9" rx="2"/><rect x="906" y="483" width="9" height="9" rx="2"/><rect x="919" y="483" width="9" height="9" rx="2"/>
    <rect x="893" y="496" width="9" height="9" rx="2"/><rect x="906" y="496" width="9" height="9" rx="2"/>
    <rect x="880" y="509" width="9" height="9" rx="2"/><rect x="893" y="509" width="9" height="9" rx="2"/><rect x="919" y="509" width="9" height="9" rx="2"/>
    <rect x="906" y="522" width="9" height="9" rx="2"/><rect x="919" y="522" width="9" height="9" rx="2"/>
    <rect x="880" y="535" width="9" height="9" rx="2"/><rect x="893" y="535" width="9" height="9" rx="2"/>
