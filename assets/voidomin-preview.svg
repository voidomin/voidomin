    <rect x="730" y="483" width="9" height="9" rx="2"/><rect x="756" y="483" width="9" height="9" rx="2"/><rect x="769" y="483" width="9" height="9" rx="2"/>
    <rect x="743" y="496" width="9" height="9" rx="2"/><rect x="756" y="496" width="9" height="9" rx="2"/>
    <rect x="730" y="509" width="9" height="9" rx="2"/><rect x="743" y="509" width="9" height="9" rx="2"/><rect x="769" y="509" width="9" height="9" rx="2"/>
    <rect x="730" y="522" width="9" height="9" rx="2"/><rect x="756" y="522" width="9" height="9" rx="2"/>
    <rect x="743" y="535" width="9" height="9" rx="2"/><rect x="769" y="535" width="9" height="9" rx="2"/>
    <rect x="730" y="548" width="9" height="9" rx="2"/><rect x="743" y="548" width="9" height="9" rx="2"/>
